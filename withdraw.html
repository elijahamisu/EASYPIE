<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Funds | EASYPIE</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-bg: #0a0e17;
            --secondary-bg: #111827;
            --accent-color: #3b82f6;
            --card-bg: rgba(31, 41, 55, 0.6);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --glass-border: rgba(255, 255, 255, 0.1);
            --nav-height: 70px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            padding-bottom: calc(var(--nav-height) + 30px);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { width: 92%; max-width: 600px; margin: 0 auto; }

        /* --- Header --- */
        header {
            padding: 20px 0;
            position: sticky; top: 0;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(15px);
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .header-flex { display: flex; justify-content: space-between; align-items: center; }

        .back-btn {
            color: white; text-decoration: none; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        .mini-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: var(--accent-color);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px;
        }

        /* --- Wallet Summary Cards --- */
        .summary-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0;
        }

        .summary-card {
            background: var(--card-bg); padding: 15px; border-radius: 18px;
            border: 1px solid var(--glass-border);
        }

        .summary-card p { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .summary-card h4 { font-size: 16px; font-weight: 700; }

        /* --- Withdrawal Form --- */
        .withdraw-section {
            background: var(--secondary-bg); padding: 25px; border-radius: 24px;
            border: 1px solid var(--glass-border); margin-bottom: 25px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

        .input-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 14px; display: flex; align-items: center;
            gap: 10px;
        }

        .input-box i { color: var(--accent-color); font-size: 16px; width: 20px; text-align: center; }
        .input-box input {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 15px; font-weight: 500; outline: none;
        }

        .balance-info {
            font-size: 12px; color: var(--text-muted); margin-top: 5px; text-align: right;
        }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--accent-color);
            color: white; border: none; border-radius: 15px; font-weight: 700;
            font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-cancel {
            width: 100%; padding: 12px; background: transparent;
            color: var(--text-muted); border: none; font-size: 14px;
            cursor: pointer; margin-top: 10px;
        }

        /* --- Withdrawal History --- */
        .history-section h3 { font-size: 16px; margin-bottom: 15px; }
        
        .history-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px;
            border: 1px solid var(--glass-border); margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .hist-info h5 { font-size: 14px; margin-bottom: 4px; }
        .hist-info p { font-size: 11px; color: var(--text-muted); }

        .hist-status { text-align: right; }
        .hist-status h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        
        .badge {
            font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 10px; text-transform: uppercase;
        }
        .pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .approved { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .rejected { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* --- Empty State --- */
        .empty-state {
            text-align: center; padding: 40px 20px;
            background: var(--card-bg); border-radius: 20px; border: 1px dashed var(--glass-border);
        }
        .empty-state i { font-size: 40px; color: var(--text-muted); margin-bottom: 15px; opacity: 0.5; }
        .empty-state p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

        /* --- Bottom Nav --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: var(--nav-height); background: rgba(17, 24, 39, 0.95);
            display: grid; grid-template-columns: repeat(5, 1fr);
            border-top: 1px solid var(--glass-border); z-index: 1000;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 4px; color: var(--text-muted);
            text-decoration: none; font-size: 10px;
        }

        .nav-item.active { color: var(--accent-color); }
        .nav-item i { font-size: 18px; }

        /* --- Loading Spinner --- */
        .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite linear; display: none; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Skeleton --- */
        .skeleton { height: 60px; background: #1f2937; border-radius: 15px; animation: pulse 1.5s infinite; margin-bottom: 10px; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Withdraw</a>
            <div class="profile-area">
                <a href="notifications.html" style="color: white; font-size: 18px; margin-right: 12px;"><i class="fas fa-bell"></i></a>
                <div class="mini-avatar" id="userAvatar">U</div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Wallet Overview -->
        <div class="summary-grid">
            <div class="summary-card">
                <p>Available Balance</p>
                <h4 id="availableBal">₦0.00</h4>
            </div>
            <div class="summary-card">
                <p>Pending Withdrawal</p>
                <h4 id="pendingBal" style="color: var(--warning);">₦0.00</h4>
            </div>
            <div class="summary-card">
                <p>Total Withdrawn</p>
                <h4 id="totalWithdrawn">₦0.00</h4>
            </div>
            <div class="summary-card">
                <p>Total Earnings</p>
                <h4 id="totalEarnings">₦0.00</h4>
            </div>
        </div>

        <!-- Withdrawal Form -->
        <section class="withdraw-section">
            <form id="withdrawForm">
                <div class="form-group">
                    <label>Withdrawal Amount (Min ₦1,000)</label>
                    <div class="input-box">
                        <i>₦</i>
                        <input type="number" id="withdrawAmount" placeholder="1000" min="1000" required>
                    </div>
                    <div class="balance-info">Withdrawable: <span id="withdrawableText">₦0.00</span></div>
                </div>

                <div class="form-group">
                    <label>Bank Name</label>
                    <div class="input-box">
                        <i class="fas fa-university"></i>
                        <input type="text" id="bankName" placeholder="e.g. GTBank" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Number</label>
                    <div class="input-box">
                        <i class="fas fa-hashtag"></i>
                        <input type="number" id="accountNumber" placeholder="0123456789" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Name</label>
                    <div class="input-box">
                        <i class="fas fa-user"></i>
                        <input type="text" id="accountName" placeholder="John Doe" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">Submit Withdrawal</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
                <button type="button" class="btn-cancel" onclick="window.location.href='dashboard.html'">Cancel</button>
            </form>
        </section>

        <!-- History -->
        <section class="history-section">
            <h3>Withdrawal History</h3>
            <div id="withdrawList">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </section>

        <!-- Quick Actions -->
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px;">
            <a href="wallet.html" class="summary-card" style="text-decoration:none; color:white; text-align:center;"><i class="fas fa-wallet"></i><br><span style="font-size:12px;">Wallet</span></a>
            <a href="deposit.html" class="summary-card" style="text-decoration:none; color:white; text-align:center;"><i class="fas fa-plus-circle"></i><br><span style="font-size:12px;">Deposit</span></a>
            <a href="investment.html" class="summary-card" style="text-decoration:none; color:white; text-align:center;"><i class="fas fa-rocket"></i><br><span style="font-size:12px;">Invest</span></a>
            <a href="transactions.html" class="summary-card" style="text-decoration:none; color:white; text-align:center;"><i class="fas fa-list"></i><br><span style="font-size:12px;">History</span></a>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-th-large"></i><span>Home</span>
        </a>
        <a href="plans.html" class="nav-item">
            <i class="fas fa-layer-group"></i><span>Plans</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i><span>Wallet</span>
        </a>
        <a href="withdraw.html" class="nav-item active">
            <i class="fas fa-arrow-circle-down"></i><span>Withdraw</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i><span>Profile</span>
        </a>
    </nav>

    <script type="module">
        const SB_URL = import.meta.env.VITE_SUPABASE_URL;
        const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let availableBalance = 0;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;

            await loadProfile();
            await loadWalletData();
            await loadWithdrawHistory();
        }

        async function loadProfile() {
            const { data } = await supabase.from('profiles').select('full_name').eq('id', currentUser.id).single();
            if (data) {
                document.getElementById('userAvatar').innerText = data.full_name.charAt(0).toUpperCase();
            }
        }

        async function loadWalletData() {
            const { data: wallet } = await supabase.from('wallets').select('*').eq('user_id', currentUser.id).single();
            if (wallet) {
                availableBalance = parseFloat(wallet.balance);
                document.getElementById('availableBal').innerText = `₦${availableBalance.toLocaleString()}`;
                document.getElementById('withdrawableText').innerText = `₦${availableBalance.toLocaleString()}`;
            }

            // Calculate pending withdrawals
            const { data: pending } = await supabase.from('withdrawals').select('amount').eq('user_id', currentUser.id).eq('status', 'pending');
            const totalPending = pending ? pending.reduce((sum, item) => sum + parseFloat(item.amount), 0) : 0;
            document.getElementById('pendingBal').innerText = `₦${totalPending.toLocaleString()}`;

            // Calculate total approved withdrawals
            const { data: approved } = await supabase.from('withdrawals').select('amount').eq('user_id', currentUser.id).eq('status', 'approved');
            const totalApproved = approved ? approved.reduce((sum, item) => sum + parseFloat(item.amount), 0) : 0;
            document.getElementById('totalWithdrawn').innerText = `₦${totalApproved.toLocaleString()}`;

            // Total Earnings
            const { data: earnings } = await supabase.from('transactions').select('amount').eq('user_id', currentUser.id).eq('type', 'earning');
            const totalE = earnings ? earnings.reduce((sum, item) => sum + parseFloat(item.amount), 0) : 0;
            document.getElementById('totalEarnings').innerText = `₦${totalE.toLocaleString()}`;
        }

        async function loadWithdrawHistory() {
            const { data } = await supabase.from('withdrawals').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const list = document.getElementById('withdrawList');
            list.innerHTML = '';

            if (!data || data.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <p>No withdrawal history found. Start investing to earn profit!</p>
                        <a href="plans.html" class="btn-submit" style="text-decoration:none; display:inline-block; width:auto; padding:10px 20px;">Start Investing</a>
                    </div>
                `;
                return;
            }

            data.forEach(w => {
                const date = new Date(w.created_at);
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="hist-info">
                        <h5>₦${parseFloat(w.amount).toLocaleString()}</h5>
                        <p>${date.toLocaleDateString()} • ${w.bank_name}</p>
                    </div>
                    <div class="hist-status">
                        <span class="badge ${w.status}">${w.status}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const bank = document.getElementById('bankName').value.trim();
            const accNum = document.getElementById('accountNumber').value.trim();
            const accName = document.getElementById('accountName').value.trim();

            // Validations
            if (amount < 1000) { alert('Minimum withdrawal is ₦1,000'); return; }
            if (amount > availableBalance) { alert('Insufficient wallet balance'); return; }
            if (accNum.length < 10) { alert('Please enter a valid account number'); return; }

            const btn = document.getElementById('submitBtn');
            const txt = document.getElementById('btnText');
            const spin = document.getElementById('btnSpinner');

            btn.disabled = true;
            txt.style.display = 'none';
            spin.style.display = 'block';

            try {
                // 1. Create Withdrawal Request
                const { error: wErr } = await supabase.from('withdrawals').insert([{
                    user_id: currentUser.id,
                    amount: amount,
                    bank_name: bank,
                    account_number: accNum,
                    account_name: accName,
                    status: 'pending'
                }]);
                if (wErr) throw wErr;

                // 2. Create Transaction Record
                await supabase.from('transactions').insert([{
                    user_id: currentUser.id,
                    amount: amount,
                    type: 'withdrawal',
                    description: `Withdrawal request to ${bank}`
                }]);

                // 3. Create Notification
                await supabase.from('notifications').insert([{
                    user_id: currentUser.id,
                    title: 'Withdrawal Pending',
                    message: `Your withdrawal request of ₦${amount.toLocaleString()} is currently pending approval.`
                }]);

                alert('Withdrawal request submitted successfully! It is now awaiting admin approval.');
                window.location.reload();

            } catch (err) {
                console.error(err);
                alert('An error occurred while processing your request. Please try again.');
                btn.disabled = false;
                txt.style.display = 'block';
                spin.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
