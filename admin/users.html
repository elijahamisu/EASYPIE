<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Management | EASYPIE Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-bg: #060b13;
            --secondary-bg: #0a0f1a;
            --sidebar-bg: #0d121f;
            --accent-color: #3b82f6;
            --card-bg: rgba(31, 41, 55, 0.4);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.08);
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Sidebar (Desktop) --- */
        aside {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--glass-border);
            position: fixed;
            height: 100vh;
            left: -260px;
            transition: 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        aside.active { left: 0; }

        .nav-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            border-left: 4px solid var(--accent-color);
        }

        /* --- Main Content --- */
        main { flex: 1; margin-left: 0; transition: 0.3s; }
        
        header {
            height: 70px;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky; top: 0; z-index: 900;
        }

        .container { padding: 25px; max-width: 1400px; margin: 0 auto; }

        /* --- Stats Row --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-mini-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }
        .stat-mini-card p { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .stat-mini-card h3 { font-size: 20px; font-weight: 700; }

        /* --- Toolbar --- */
        .toolbar {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 250px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            outline: none;
        }
        .filter-select {
            background: var(--secondary-bg);
            color: white;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            outline: none;
            font-size: 13px;
        }
        .btn-export {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        /* --- Users Table --- */
        .table-container {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { text-align: left; padding: 15px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid var(--glass-border); }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid var(--glass-border); vertical-align: middle; }
        
        .user-cell { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-weight: 700; }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .suspended { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .btn-action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 5px; transition: 0.3s; }
        .btn-action-icon:hover { color: var(--accent-color); }

        /* --- Pagination --- */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 25px; }
        .btn-page { background: var(--card-bg); color: white; border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 2000; padding: 20px; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--sidebar-bg); width: 100%; max-width: 800px;
            border-radius: 24px; border: 1px solid var(--glass-border);
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--sidebar-bg); z-index: 10; }
        .modal-body { padding: 25px; }

        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .detail-item label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .detail-item p { font-size: 14px; font-weight: 600; }

        .tab-menu { display: flex; gap: 20px; border-bottom: 1px solid var(--glass-border); margin-bottom: 20px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding-bottom: 10px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

        /* Desktop Adjustments */
        @media (min-width: 1024px) {
            aside { left: 0; }
            main { margin-left: var(--sidebar-width); }
        }

        .overlay-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-bg); z-index: 3000;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="loader" class="overlay-loader">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 30px; color: var(--accent-color);"></i>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div style="padding: 30px 25px; font-size: 20px; font-weight: 800; color: var(--accent-color);">EASYPIE ADMIN</div>
        <nav style="flex:1">
            <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="users.html" class="nav-item active"><i class="fas fa-users"></i> Users</a>
            <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i> Deposits</a>
            <a href="withdrawals.html" class="nav-item"><i class="fas fa-arrow-up"></i> Withdrawals</a>
            <a href="investments.html" class="nav-item"><i class="fas fa-rocket"></i> Investments</a>
            <a href="giftcodes.html" class="nav-item"><i class="fas fa-gift"></i> Gift Codes</a>
            <a href="support.html" class="nav-item"><i class="fas fa-headset"></i> Support Tickets</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        </nav>
        <a href="#" onclick="adminLogout()" class="nav-item" style="color: var(--danger); border-top: 1px solid var(--glass-border);"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </aside>

    <main>
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fas fa-bars" style="cursor:pointer; color:var(--text-muted)" id="mobileMenuBtn"></i>
                <h2 style="font-size: 18px;">User Management</h2>
            </div>
            <div id="adminProfile" style="display:flex; align-items:center; gap:10px;">
                <span id="adminName" style="font-size: 12px; font-weight: 600;">Admin</span>
                <div class="user-avatar" style="width:30px; height:30px; font-size:10px;">AD</div>
            </div>
        </header>

        <div class="container">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-mini-card"><p>Total Users</p><h3 id="totalUsers">0</h3></div>
                <div class="stat-mini-card"><p>Active</p><h3 id="activeUsersCount" style="color: var(--success);">0</h3></div>
                <div class="stat-mini-card"><p>Suspended</p><h3 id="suspendedUsersCount" style="color: var(--danger);">0</h3></div>
                <div class="stat-mini-card"><p>New Today</p><h3 id="newUsersCount" style="color: var(--accent-color);">0</h3></div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <input type="text" class="search-input" id="userSearch" placeholder="Search name, email, username, or ID...">
                <select class="filter-select" id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="suspended">Suspended</option>
                </select>
                <button class="btn-export" onclick="exportUsers()"><i class="fas fa-file-csv"></i> Export CSV</button>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User Details</th>
                            <th>Username</th>
                            <th>Wallet</th>
                            <th>Investments</th>
                            <th>Joined</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="btn-page" id="prevPage"><i class="fas fa-chevron-left"></i></button>
                <span id="pageInfo" style="font-size: 13px; color: var(--text-muted);">Page 1 of 1</span>
                <button class="btn-page" id="nextPage"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </main>

    <!-- User Detail Modal -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>User Profile Details</h3>
                <i class="fas fa-times" onclick="closeModal()" style="cursor:pointer"></i>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script type="module">
        const SB_URL = import.meta.env.VITE_SUPABASE_URL;
        const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let usersData = [];
        let filteredUsers = [];
        let currentPage = 1;
        const perPage = 15;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            const { data: profile } = await supabase.from('profiles').select('is_admin, full_name').eq('id', session.user.id).single();
            if (!profile?.is_admin) { window.location.href = '../login.html'; return; }
            
            document.getElementById('adminName').innerText = profile.full_name;
            document.getElementById('loader').style.display = 'none';

            await fetchUsers();
            setupEventListeners();
            setupRealtime();
        }

        async function fetchUsers() {
            // Join with wallets to get balance and investments to get active count
            const { data, error } = await supabase
                .from('profiles')
                .select(`
                    *,
                    wallets(balance),
                    investments(id, status)
                `)
                .order('created_at', { ascending: false });

            if (data) {
                usersData = data;
                applyFilters();
                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('totalUsers').innerText = usersData.length;
            document.getElementById('activeUsersCount').innerText = usersData.filter(u => u.status !== 'suspended').length;
            document.getElementById('suspendedUsersCount').innerText = usersData.filter(u => u.status === 'suspended').length;
            const today = new Date().toDateString();
            document.getElementById('newUsersCount').innerText = usersData.filter(u => new Date(u.created_at).toDateString() === today).length;
        }

        function applyFilters() {
            const query = document.getElementById('userSearch').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            filteredUsers = usersData.filter(u => {
                const matchSearch = u.full_name.toLowerCase().includes(query) || 
                                    u.email?.toLowerCase().includes(query) || 
                                    u.username.toLowerCase().includes(query) ||
                                    u.id.includes(query);
                const matchStatus = status === 'all' || (status === 'active' ? u.status !== 'suspended' : u.status === 'suspended');
                return matchSearch && matchStatus;
            });

            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('usersTableBody');
            body.innerHTML = '';

            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const paginated = filteredUsers.slice(start, end);

            paginated.forEach(u => {
                const balance = u.wallets?.[0]?.balance || 0;
                const activeInvs = u.investments?.filter(i => i.status === 'active').length || 0;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar">${u.full_name.charAt(0)}</div>
                            <div>
                                <p style="font-weight:700">${u.full_name}</p>
                                <p style="font-size:11px; color:var(--text-muted)">${u.id.slice(0,8)}</p>
                            </div>
                        </div>
                    </td>
                    <td>@${u.username}</td>
                    <td><b>₦${parseFloat(balance).toLocaleString()}</b></td>
                    <td>${activeInvs} Active</td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td><span class="status-pill ${u.status === 'suspended' ? 'suspended' : 'active'}">${u.status || 'active'}</span></td>
                    <td>
                        <button class="btn-action-icon" onclick="viewUser('${u.id}')" title="View"><i class="fas fa-eye"></i></button>
                        <button class="btn-action-icon" onclick="toggleSuspend('${u.id}', '${u.status}')" title="${u.status === 'suspended' ? 'Activate' : 'Suspend'}"><i class="fas ${u.status === 'suspended' ? 'fa-user-check' : 'fa-user-slash'}"></i></button>
                        <button class="btn-action-icon" style="color:var(--danger)" onclick="deleteUser('${u.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                body.appendChild(row);
            });

            const totalPages = Math.ceil(filteredUsers.length / perPage) || 1;
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        window.viewUser = (id) => {
            const u = usersData.find(user => user.id === id);
            const balance = u.wallets?.[0]?.balance || 0;
            const activeInvs = u.investments?.filter(i => i.status === 'active').length || 0;

            const modal = document.getElementById('userModal');
            const body = document.getElementById('modalBody');

            body.innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item"><label>Full Name</label><p>${u.full_name}</p></div>
                    <div class="detail-item"><label>Username</label><p>@${u.username}</p></div>
                    <div class="detail-item"><label>Phone</label><p>${u.phone || 'N/A'}</p></div>
                    <div class="detail-item"><label>Joined Date</label><p>${new Date(u.created_at).toLocaleString()}</p></div>
                </div>
                <div style="background:rgba(0,0,0,0.2); padding:20px; border-radius:15px; margin-bottom:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div><label style="font-size:10px; color:var(--text-muted)">WALLET BALANCE</label><h2 style="color:var(--success)">₦${parseFloat(balance).toLocaleString()}</h2></div>
                    <div><label style="font-size:10px; color:var(--text-muted)">ACTIVE INVESTMENTS</label><h2>${activeInvs}</h2></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn-export" style="flex:1" onclick="sendDirectNotification('${u.id}')">Send Notification</button>
                    <button class="btn-export" style="flex:1; background:var(--warning)" onclick="resetUserWallet('${u.id}')">Reset Wallet</button>
                </div>
            `;
            modal.style.display = 'flex';
        };

        window.toggleSuspend = async (id, currentStatus) => {
            const newStatus = currentStatus === 'suspended' ? 'active' : 'suspended';
            if (confirm(`Are you sure you want to ${newStatus} this user?`)) {
                const { error } = await supabase.from('profiles').update({ status: newStatus }).eq('id', id);
                if (!error) fetchUsers();
            }
        };

        window.deleteUser = async (id) => {
            if (confirm("DANGER: This action is irreversible. Delete user and all associated records?")) {
                const { error } = await supabase.from('profiles').delete().eq('id', id);
                if (!error) fetchUsers();
                else alert("Could not delete. Check database constraints.");
            }
        };

        window.exportUsers = () => {
            let csv = 'ID,Name,Username,Status,Balance,Joined\n';
            filteredUsers.forEach(u => {
                csv += `${u.id},${u.full_name},${u.username},${u.status || 'active'},${u.wallets?.[0]?.balance || 0},${u.created_at}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `easypie_users_${Date.now()}.csv`;
            a.click();
        };

        function setupEventListeners() {
            document.getElementById('userSearch').addEventListener('input', () => { currentPage = 1; applyFilters(); });
            document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; applyFilters(); });
            document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
            document.getElementById('nextPage').onclick = () => { if (currentPage * perPage < filteredUsers.length) { currentPage++; renderTable(); } };
            document.getElementById('mobileMenuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('active');
        }

        function setupRealtime() {
            supabase.channel('public:profiles').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, fetchUsers).subscribe();
        }

        window.closeModal = () => document.getElementById('userModal').style.display = 'none';

        window.adminLogout = async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
